[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "continuum"
version = "0.1.0"
description = "Voice-native conversation continuity assistant — Rime Hackathon submission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "livekit-agents>=0.11,<1.0",
    "livekit-plugins-rime>=0.3,<1.0",
    "livekit-plugins-deepgram>=0.6,<1.0",
    "livekit-plugins-silero>=0.6,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "google-generativeai>=0.7,<1.0",
    "anthropic>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "aiohttp>=3.10,<4.0",
    "python-dotenv>=1.0,<2.0",
    "soundfile>=0.12,<1.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "mocks*", "modules*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["evaluation", "tests", "dashboard", "modules/signal/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
